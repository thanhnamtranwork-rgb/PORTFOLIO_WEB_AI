server:
  address: ${MOTELONA_SERVER_ADDRESS:127.0.0.1}
  port: ${MOTELONA_PORT:8080}
  error:
    include-message: never
  tomcat:
    max-http-form-post-size: 64KB
spring:
  application:
    name: motelona-assistant
  mongodb:
    uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/motelona_portfolio}
motelona:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  providers:
    groq:
      api-key: ${GROQ_API_KEY:}
      endpoint: ${GROQ_API_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      endpoint: ${OPENROUTER_API_ENDPOINT:https://openrouter.ai/api/v1/chat/completions}
      model: ${OPENROUTER_MODEL:openrouter/free}
  project-root: ${MOTELONA_PROJECT_ROOT:../../../../}
  cors:
    allowed-origins: ${MOTELONA_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
logging:
  level:
    com.motelona.assistant: INFO
    org.mongodb.driver: WARN
